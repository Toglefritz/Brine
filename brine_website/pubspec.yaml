name: brinemonitor
description: The website for the Brine water softener monitor.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=2.19.6 <3.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Used to interact with Firebase Cloud Functions
  cloud_functions: ^4.3.4
  # A critical security plugin that generates a decorative confetti effect
  confetti: ^0.7.0
  # Default icons asset for Cupertino widgets
  cupertino_icons: ^1.0.5
  # Provides localizations for text (generate with `flutter gen-l10n`)
  flutter_localizations:
    sdk: flutter
  firebase_analytics: ^10.4.3
  # SDK for Firebase Auth authentication service
  firebase_auth: ^4.7.2
  # Provides core Firebase services
  firebase_core: ^2.15.0
  # Flutter plugin for Firebase Crashlytics
  firebase_crashlytics: ^3.3.4
  # A set of loading widgets
  flutter_spinkit: ^5.2.0
  # Provides additional icons beyond the set available from Material Design
  font_awesome_flutter: ^10.4.0
  # Provides font families
  google_fonts: ^4.0.3
  # Allows users to authenticate with Google
  google_sign_in: ^6.0.2
  # Navigation plugin supporting URL-based routing
  go_router: ^6.5.5
  # Used for internationalization
  intl: any
  # Wrapper around InheritedWidget
  provider: ^6.0.5
  # Flutter plugin for sharing content via the platform share UI
  share_plus: ^7.0.2
  # Saves key-value pairs to store user preferences
  shared_preferences: ^2.1.1
  # Plugin for launching URLs
  url_launcher: ^6.1.11
  # Allows setting the web app URL strategy
  url_strategy: ^0.2.0

  # The Brine mobile app included as a submodule for demonstration purposes
  brine:
    path: Brine_App

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/