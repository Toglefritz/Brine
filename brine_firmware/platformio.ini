; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; Common configuration shared across environments
[common]
platform = espressif32
framework = arduino
monitor_speed = 115200
board_build.flash_mode = qio
board_build.partitions = min_spiffs.csv
lib_deps = 
	sparkfun/SparkFun Qwiic Button and Qwiic Switch Library@^2.0.6
	sparkfun/SparkFun VL53L1X 4m Laser Distance Sensor@^1.2.12
	adafruit/Adafruit_VL53L0X@^1.2.0
	bblanchon/ArduinoJson@^7.0.4
	sparkfun/SparkFun ATECCX08a Arduino Library@^1.3.1
	sparkfun/SparkFun MAX1704x Fuel Gauge Arduino Library@^1.0.4
	fastled/FastLED@^3.6.0

; Base build flags used across all environments
; FLAVOR: Use 1 for development or 2 for production
; DEBUG_MODE: Use 1 to enable debug output or zero to disable this output
; Hardware-specific flags are added per environment:
;   I2C_SDA_PIN: I2C SDA pin number
;   I2C_SCL_PIN: I2C SCL pin number
;   BATTERY_MONITOR_MAX17048: Use MAX17048 fuel gauge (I2C)
;   BATTERY_MONITOR_VOLTAGE_DIVIDER: Use voltage divider (ADC)
;   BATTERY_ADC_PIN: ADC pin for voltage divider (default A0 if not specified)
;   VL53L0X_SENSOR: Include VL53L0X distance sensor
;   SK6812_LED: Include SK6812 addressable LED support
[base_flags]
build_flags = 
    -I include
    -D FLAVOR=2
    -D DEBUG_MODE=1
    -D FIREBASE_EMULATOR_IP="\"192.168.86.39\""
    -D GPIO_BUTTON_PIN=8

; [env:sparkfun_esp32_iot_redboard]
; extends = common
; board = sparkfun_esp32_iot_redboard
; build_flags = 
;     ${base_flags.build_flags}
;     -D I2C_SDA_PIN=21
;     -D I2C_SCL_PIN=22
;     -D BATTERY_MONITOR_MAX17048  

[env:seeed_xiao_esp32c3]
extends = common
board = seeed_xiao_esp32c3
build_flags = 
    ${base_flags.build_flags}
    -D I2C_SDA_PIN=6
    -D I2C_SCL_PIN=7
    -D SK6812_LED
    -D SK6812_DATA_PIN=10
    -D VL53L0X_SENSOR
    -D BATTERY_MONITOR_VOLTAGE_DIVIDER
    -D BATTERY_ADC_PIN=A2
    -D PWR_KILL_PIN=20
    -D PWR_INT_PIN=2

; Native emulator environment
; Compiles for the host machine (macOS) instead of ESP32 hardware.
; Simulates the firmware's sensor-upload cycle with controllable sensor values
; and real HTTP calls to the Firebase backend.
;
; Usage:
;   pio run -e emulator            # Build the emulator
;   .pio/build/emulator/program    # Run the emulator binary
[env:emulator]
platform = native
build_flags = 
    -I include
    -I emulator
    -D NATIVE_EMULATOR
    -D FLAVOR=1
    -D DEBUG_MODE=1
    -D FIREBASE_EMULATOR_IP="\"192.168.86.39\""
    -D GPIO_BUTTON_PIN=8
    -D I2C_SDA_PIN=5
    -D I2C_SCL_PIN=6
    -D SK6812_LED
    -D SK6812_DATA_PIN=9
    -D VL53L0X_SENSOR
    -D BATTERY_MONITOR_VOLTAGE_DIVIDER
    -D BATTERY_ADC_PIN=A1
    -std=c++17
    -lcurl

build_src_filter =
    -<*>
    +<../emulator/emulator_main.cpp>

lib_deps =
    bblanchon/ArduinoJson@^7.0.4

lib_ignore =
    BLEModule
    ButtonService
    GPIOButton
    I2CButton
    I2CLED
    LEDService
    MAX17048Monitor
    VL53L0XSensor
    VL53L1XSensor
    VoltageDividerMonitor
    SK6812LED
    BatteryMonitor
    DistanceSensor
    OTAService
    PowerLatch

test_ignore =
    test_SK6812LED
