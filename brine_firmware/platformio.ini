[env:seeed_xiao_esp32s3]
extends = common
board = seeed_xiao_esp32s3
build_flags = 
    ${base_flags.build_flags}
    -D I2C_SDA_PIN=5
    -D I2C_SCL_PIN=6
    -D WS2812B_LED
    -D WS2812B_DATA_PIN=9
    -D VL53L0X_SENSOR
    -D BATTERY_MONITOR_VOLTAGE_DIVIDER
    -D BATTERY_ADC_PIN=A1

