; PlatformIO Project Configuration File
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; Environment for main project sketch for Brine IoT device firmware
[env:sparkfun_esp32_iot_redboard]
platform = espressif32
board = sparkfun_esp32_iot_redboard
framework = arduino
monitor_speed = 115200
lib_deps = sparkfun/SparkFun Qwiic Button and Qwiic Switch Library@^2.0.6
build_flags = -D DEBUG_MODE=1
