; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; Common configuration shared across environments
[common]
platform = espressif32
framework = arduino
monitor_speed = 115200
board_build.flash_mode = qio
board_build.partitions = min_spiffs.csv
lib_deps = 
	sparkfun/SparkFun Qwiic Button and Qwiic Switch Library@^2.0.6
	sparkfun/SparkFun VL53L1X 4m Laser Distance Sensor@^1.2.12
	adafruit/Adafruit_VL53L0X@^1.2.0
	bblanchon/ArduinoJson@^7.0.4
	sparkfun/SparkFun ATECCX08a Arduino Library@^1.3.1
	armmbed/mbedtls@^2.23.0
	sparkfun/SparkFun MAX1704x Fuel Gauge Arduino Library@^1.0.4
	fastled/FastLED@^3.6.0

; Base build flags used across all environments
; FLAVOR: Use 1 for development or 2 for production
; DEBUG_MODE: Use 1 to enable debug output or zero to disable this output
; Hardware-specific flags are added per environment:
;   I2C_SDA_PIN: I2C SDA pin number
;   I2C_SCL_PIN: I2C SCL pin number
;   BATTERY_MONITOR_MAX17048: Use MAX17048 fuel gauge (I2C)
;   BATTERY_MONITOR_VOLTAGE_DIVIDER: Use voltage divider (ADC)
;   BATTERY_ADC_PIN: ADC pin for voltage divider (default A0 if not specified)
;   VL53L0X_SENSOR: Include VL53L0X distance sensor
;   WS2812B_LED: Include WS2812B addressable LED support
[base_flags]
build_flags = 
    -I include
    -D FLAVOR=2
    -D DEBUG_MODE=1
    -D FIREBASE_EMULATOR_IP="\"192.168.86.39\""
    -D GPIO_BUTTON_PIN=8

