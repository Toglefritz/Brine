name: brine
description: Companion app for the Brine water softener monitor.

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=2.18.4 <3.0.0'

dependencies:
  flutter:
    sdk: flutter
  # Used to access Firestore
  cloud_firestore: ^4.15.6
  # Used to call Firebase callable functions
  cloud_functions: ^4.6.7
  # Creates Material color schemes based on a platform's implementation of dynamic color
  dynamic_color: ^1.6.9
  # Used to display SVG assets
  flutter_svg: ^2.0.10+1
  # Provides additional icons beyond the Material icons
  font_awesome_flutter: ^10.7.0
  # Protects backend resources
  firebase_app_check: ^0.2.1+16
  # Enables the use of Firebase services
  firebase_core: ^2.26.0
  # Firebase Auth services
  firebase_auth: ^4.17.6
  # Used to get Google Fonts font styles
  google_fonts: ^6.1.0
  # Allows authentication using a Google account
  google_sign_in: ^6.2.1
  # Automates setting the app icons
  flutter_launcher_icons: ^0.13.1
  # Provides loading widgets
  flutter_spinkit: ^5.2.0
  # Used to define localizable strings
  flutter_localizations:
    sdk: flutter
  # API for making REST API requests
  http: ^1.2.1
  # Used for internationalization
  intl: ^0.18.1
  # Lint rules for Dart and Flutter used internally at Very Good Ventures
  very_good_analysis: ^5.1.0

dependency_overrides:
  web: ^0.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/
    - assets/icons/

flutter_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icons/brine_round.png"
  remove_alpha_ios: true
  adaptive_icon_background: #ffffff
  adaptive_icon_foreground: "assets/icons/brine_round.png"
