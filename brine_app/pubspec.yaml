name: brine
description: Companion app for the Brine water softener monitor.

publish_to: 'none'

version: 1.0.0+0

environment:
  sdk: ^3.9.2

dependencies:
  # Used to access Firestore
  cloud_firestore: ^5.6.9
  # Used to call Firebase callable functions
  cloud_functions: ^5.5.2
  # Used to track user interactions, app usage, and events
  firebase_analytics: ^11.5.0
  # Protects backend resources
  firebase_app_check: ^0.3.2+7
  # Firebase Auth services
  firebase_auth: ^5.6.0
  # Enables the use of Firebase services
  firebase_core: ^3.14.0
  # Reports errors to the Firebase console
  firebase_crashlytics: ^4.3.7
  # Used to send push notifications
  firebase_messaging: ^15.2.7
  # The Flutter SDK.
  flutter:
    sdk: flutter
  # Used to define localizable strings
  flutter_localizations:
    sdk: flutter
  # Provides loading widgets
  flutter_splendid_ble: ^0.16.2
  # Used to get Google Fonts font styles
  google_fonts: ^6.2.1
  # Allows authentication using a Google account
  google_sign_in: ^6.3.0
  # API for making REST API requests
  http: ^1.3.0
  # Used for internationalization
  intl: ^0.20.2

dependency_overrides:
  path_provider: ^2.1.5

dev_dependencies:
  # Build system for Dart code generation.
  build_runner: ^2.4.15
  # Used for mocking HTTP calls in tests.
  fake_http_client: ^2.0.0
  # Lint rules for Dart and Flutter.
  flutter_lints: ^4.0.0
  # Provide automated testing tools.
  flutter_test:
    sdk: flutter
  # Mocking library for Dart.
  mockito: ^5.4.5
  # Lint rules for Dart and Flutter used internally at Very Good Ventures
  very_good_analysis: ^7.0.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/
    - assets/icons/
