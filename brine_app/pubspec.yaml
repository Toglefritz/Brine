name: brine
description: Companion app for the Brine water softener monitor.

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=2.18.4 <3.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Used to access Firestore
  cloud_firestore: ^4.17.4
  # Used to call Firebase callable functions
  cloud_functions: ^4.7.5
  # Flutter plugin for interacting with BLE devices
  flutter_splendid_ble: ^0.10.0
  # Used to display SVG assets
  flutter_svg: ^2.0.10+1
  # Provides additional icons beyond the Material icons
  font_awesome_flutter: ^10.7.0
  # Used to track user interactions, app usage, and events
  firebase_analytics: ^10.10.6
  # Protects backend resources
  firebase_app_check: ^0.2.2+6
  # Enables the use of Firebase services
  firebase_core: ^2.31.1
  # Reports errors to the Firebase console
  firebase_crashlytics: ^3.5.6
  # Firebase Auth services
  firebase_auth: ^4.19.6
  # Used to get Google Fonts font styles
  google_fonts: ^6.2.1
  # Allows authentication using a Google account
  google_sign_in: ^6.2.1
  # Provides loading widgets
  flutter_spinkit: ^5.2.1
  # Used to define localizable strings
  flutter_localizations:
    sdk: flutter
  # API for making REST API requests
  http: ^1.2.1
  # Used for internationalization
  intl: ^0.19.0
  # Lint rules for Dart and Flutter used internally at Very Good Ventures
  very_good_analysis: ^5.1.0

dependency_overrides:
  web: ^0.5.0

dev_dependencies:
  flutter_lints: ^4.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/
    - assets/icons/
