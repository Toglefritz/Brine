name: Test

on:
  push:
    branches: [main]
    paths:
      - 'brine_app/lib/**'
      - 'brine_app/test/**'
      - 'brine_app/pubspec.yaml'
      - 'brine_app/pubspec.lock'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: brine_app

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.3'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test
